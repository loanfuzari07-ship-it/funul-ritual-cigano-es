    const slider = root.getElementById('slider');
    const handle = root.getElementById('sliderHandle');
    const fill = root.getElementById('sliderFill');
    const label = root.getElementById('sliderLabel');

    let dragging = false;
    let startX = 0;
    let maxDrag = 0;
    let completed = false;

    function getTrackWidth(){
      return slider.getBoundingClientRect().width;
    }

    function getHandleWidth(){
      return handle.getBoundingClientRect().width;
    }

    function setHandlePos(x){
      const clamped = Math.max(0, Math.min(x, maxDrag));
      handle.style.transform = `translateX(${clamped}px)`;
      fill.style.width = (getHandleWidth() + 4 + clamped) + 'px';
      return clamped;
    }

    function pointerDown(e){
      if (completed) return;
      dragging = true;
      startX = (e.touches ? e.touches[0].clientX : e.clientX);
      maxDrag = getTrackWidth() - getHandleWidth() - 10; // track padding both sides
      handle.style.transition = 'none';
    }

    function pointerMove(e){
      if (!dragging || completed) return;
      const clientX = (e.touches ? e.touches[0].clientX : e.clientX);
      const delta = clientX - startX;
      const pos = setHandlePos(delta);
      if (pos >= maxDrag - 4){
        completeSlide();
      }
    }

    function pointerUp(){
      if (!dragging || completed) return;
      dragging = false;
      handle.style.transition = 'transform 0.3s cubic-bezier(.2,.8,.2,1)';
      fill.style.transition = 'width 0.3s cubic-bezier(.2,.8,.2,1)';
      setHandlePos(0);
    }

    function completeSlide(){
      completed = true;
      dragging = false;
      slider.classList.add('completed');
      handle.style.transition = 'transform 0.25s ease';
      setHandlePos(maxDrag);
      // Punto de entrada para avanzar a la siguiente etapa del embudo
      setTimeout(() => {
        goNext();
      }, 250);
    }

    handle.addEventListener('mousedown', pointerDown);
    handle.addEventListener('touchstart', pointerDown, { passive: true });
    window.addEventListener('mousemove', pointerMove);
    window.addEventListener('touchmove', pointerMove, { passive: true });
    window.addEventListener('mouseup', pointerUp);
    window.addEventListener('touchend', pointerUp);
    window.addEventListener('resize', () => {
      if (!completed) maxDrag = getTrackWidth() - getHandleWidth() - 10;
    });
  
</script>

<script type="text/plain" id="script-step-3">

    // Contador estilo odômetro: cada dígito rola verticalmente quando muda
    const el = root.getElementById('counterNumber');
    const badge = root.getElementById('counterBadge');
    const badgeText = root.getElementById('badgeText');
    let value = 7265;
    let weekBump = 214;

    function buildDigitSlot(digit){
      const slot = document.createElement('div');
      slot.className = 'digit-slot';
      const track = document.createElement('div');
      track.className = 'digit-track';
      for (let i = 0; i <= 9; i++){
        const s = document.createElement('span');
        s.textContent = i;
        track.appendChild(s);
      }
      slot.appendChild(track);
      slot.dataset.value = digit;
      return slot;
    }

    function setTrackPosition(track, digit, animate){
      const slotHeight = track.parentElement.getBoundingClientRect().height;
      track.style.transition = animate ? '' : 'none';
      track.style.transform = `translateY(-${digit * slotHeight}px)`;
    }

    function render(n, animate){
      const str = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      const chars = str.split('');
      const firstBuild = !el.children.length;

      if (firstBuild){
        chars.forEach(ch => {
          if (ch === '.' || ch === ','){
            const comma = document.createElement('span');
            comma.className = 'digit-comma';
            comma.textContent = ch;
            el.appendChild(comma);
          } else {
            el.appendChild(buildDigitSlot(parseInt(ch, 10)));
          }
        });
        // Now that slots are in the DOM, their real height is measurable —
        // position every digit track in a second pass (no transition on first paint).
        requestAnimationFrame(() => {
          el.querySelectorAll('.digit-slot').forEach(slot => {
            const track = slot.querySelector('.digit-track');
            setTrackPosition(track, parseInt(slot.dataset.value, 10), false);
          });
        });
        return;
      }

      // Update existing slots (digits only, in order)
      const slots = el.querySelectorAll('.digit-slot');
      let slotIndex = 0;
      chars.forEach(ch => {
        if (ch === '.' || ch === ',') return;
        const slot = slots[slotIndex];
        if (slot){
          const digit = parseInt(ch, 10);
          if (String(slot.dataset.value) !== ch){
            const track = slot.querySelector('.digit-track');
            setTrackPosition(track, digit, animate);
            slot.dataset.value = digit;
          }
        }
        slotIndex++;
      });
    }

    render(value, false);

    function bump(){
      value += Math.floor(Math.random() * 3) + 1;
      weekBump += 1;
      render(value, true);
      badgeText.textContent = `+${weekBump} esta semana`;
      badge.classList.add('bump');
      setTimeout(() => badge.classList.remove('bump'), 250);
    }

    // Empieza a subir justo después del primer renderizado, sin esperar el intervalo completo
    setTimeout(bump, 900);
    setInterval(bump, 4200);

    window.addEventListener('resize', () => {
      el.querySelectorAll('.digit-slot').forEach(slot => {
        const track = slot.querySelector('.digit-track');
        setTrackPosition(track, parseInt(slot.dataset.value, 10), false);
      });
    });

    // Clic en el CTA -> punto de entrada para avanzar a la siguiente etapa del embudo
    root.getElementById('ctaBtn').addEventListener('click', () => {
      goNext();
    });
  
</script>

    // Genera un código de barras fiel a un Code-128 real: altura uniforme,
    // solo el ANCHO de las barras varía (fino/medio/grueso), con un patrón de espaciado real.
    function buildBarcode(el, count){
      const widths = [1.5, 2.5, 4]; // fino, medio, grueso — como un código real
      let lastWasBar = false;
      for (let i = 0; i < count; i++){
        const bar = document.createElement('span');
        const w = widths[Math.floor(Math.random() * widths.length)];
        bar.style.width = w + 'px';
        bar.style.background = lastWasBar ? 'transparent' : 'var(--ink)';
        lastWasBar = !lastWasBar;
        el.appendChild(bar);
      }
    }
    buildBarcode(root.getElementById('barcode'), 40);
    buildBarcode(root.getElementById('barcodeBack'), 34);

    // Contador de vales restantes, disminuye poco a poco para reforzar la urgencia
    const vagasEl = root.getElementById('vagasRestantes');
    let vagas = 39;
    const vagasTimer = setInterval(() => {
      if (vagas > 6){
        vagas -= 1;
        vagasEl.textContent = vagas;
      }
    }, 9000);

    // ---- Confeti ----
    const confettiColors = ['#ff4d6d', '#ffd23f', '#3ddc84', '#4cc9f0', '#ff8c42', '#c77dff', '#fdfdf8'];
    function spawnConfetti(){
      const layer = root.getElementById('confettiLayer');
      const count = 140;
      for (let i = 0; i < count; i++){
        const piece = document.createElement('span');
        piece.className = 'confetti-piece';
        const isCircle = Math.random() > 0.5;
        piece.style.left = Math.random() * 100 + '%';
        piece.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
        piece.style.width = piece.style.height = (isCircle ? 7 + Math.random() * 4 : 6 + Math.random() * 5) + 'px';
        if (isCircle) piece.style.borderRadius = '50%';
        piece.style.setProperty('--fall-duration', (2.2 + Math.random() * 1.6) + 's');
        piece.style.setProperty('--fall-delay', (Math.random() * 0.4) + 's');
        piece.style.setProperty('--drift', (Math.random() * 140 - 70) + 'px');
        piece.style.setProperty('--spin', (Math.random() * 720 - 360) + 'deg');
        layer.appendChild(piece);
        setTimeout(() => piece.remove(), 4200);
      }
    }

    // ---- Clic en el botón: voltea la tarjeta, revela la oferta, cambia los textos y lanza confeti ----
    let revealed = false;
    root.getElementById('ctaBtn').addEventListener('click', () => {
      if (!revealed){
        revealed = true;
        clearInterval(vagasTimer);

        spawnConfetti();
        root.getElementById('voucherFlip').classList.add('flipped');

        root.getElementById('headline').innerHTML = '¡Vale<br>Canjeado! 🎉';
        root.getElementById('subtext').textContent = 'Haz clic abajo para finalizar tu acceso y asegurar el descuento hoy antes de las 23:59.';
        root.getElementById('ctaBtn').textContent = 'Finalizar Acceso';
      } else {
        // Punto de entrada para avanzar a la siguiente etapa del embudo
        goNext();
      }
    });
  
</script>

<script>
  const TOTAL_STEPS = 10;
  const app = document.getElementById('app');
  const hosts = {};
  let currentStep = null;

  // Etapas que precisam rodar em um <iframe> de verdade, em vez de Shadow DOM.
  // Necessário pra etapa 2 (VSL) porque o script do player VTurb usa
  // document.getElementById() pra achar o player — e essa busca não
  // consegue enxergar dentro de uma Shadow DOM. Um iframe tem seu próprio
  // documento HTML isolado de verdade, então o script funciona normal,
  // exatamente como no arquivo separado.
  const IFRAME_STEPS = { 2: 'funil-etapa-2.html' };

  function goNext(){
    showStep(Math.min((currentStep || 1) + 1, TOTAL_STEPS));
  }

  // Recebe o aviso de "avançar" vindo de dentro de um iframe (etapa 2)
  window.addEventListener('message', (event) => {
    if (event.data === 'funil:avancar'){
      goNext();
    }
  });

  function showStep(n){
    const prevHost = currentStep ? hosts[currentStep] : null;
    currentStep = n;

    if (!hosts[n]){
      buildStep(n);
    }
    const nextHost = hosts[n];

    // A etapa anterior desliza/esmaece suavemente pra fora, sem afetar o
    // layout (vira position:absolute), enquanto a nova já aparece por baixo.
    if (prevHost && prevHost !== nextHost){
      prevHost.classList.remove('active');
      prevHost.classList.add('leaving');
      setTimeout(() => {
        prevHost.classList.remove('leaving');
        prevHost.style.display = 'none';
      }, 320);
    }

    nextHost.style.display = 'block';
    // força um reflow antes de ativar a transição, senão o navegador
    // não anima (ele já nasceria direto no estado final)
    void nextHost.offsetWidth;
    nextHost.classList.add('active');

    window.scrollTo(0, 0);
  }

  // Monta e inicializa a etapa SÓ na hora em que ela vai aparecer.
  function buildStep(n){
    const host = document.createElement('div');
    host.className = 'step-host';
    host.dataset.step = n;

    if (IFRAME_STEPS[n]){
      // Etapa em iframe real (sem Shadow DOM), pra scripts de terceiros
      // (tipo o player VTurb) funcionarem normalmente.
      const iframe = document.createElement('iframe');
      iframe.src = IFRAME_STEPS[n];
      iframe.setAttribute('frameborder', '0');
      iframe.setAttribute('scrolling', 'no');
      iframe.style.cssText = 'display:block; width:100%; height:100%; min-height:100vh; min-height:100dvh; border:none;';
      iframe.allow = 'autoplay; fullscreen';
      host.appendChild(iframe);
      app.appendChild(host);
      hosts[n] = host;
      return;
    }

    const tpl = document.getElementById('tpl-step-' + n);
    const shadow = host.attachShadow({ mode: 'open' });
    shadow.appendChild(tpl.content.cloneNode(true));
    app.appendChild(host);
    hosts[n] = host;

    const scriptTag = document.getElementById('script-step-' + n);
    if (scriptTag){
      try {
        const fn = new Function('root', 'goNext', 'window', scriptTag.textContent);
        fn(shadow, goNext, window);
      } catch (err){
        console.error('Erro ao iniciar a etapa ' + n, err);
      }
    }
  }

  showStep(1);
</script>
