<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0a0908;
    --gold: #c9a24a;
    --gold-soft: #e6c977;
    --red-deep: #6e1414;
    --text: #f3ede1;
    --text-dim: #a89e8c;
    --border: rgba(201,162,74,0.28);
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body{
    font-family: 'Manrope', sans-serif;
    color: var(--text);
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  .stage vturb-smartplayer{
    display: block !important;
    width: 100% !important;
    height: 100% !important;
    max-width: none !important;
    margin: 0 !important;
  }

  .stage .vturb-player-placeholder{
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    padding: 0 !important;
  }

  /* progress bar - top */
  .vprogress{
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(255,255,255,0.12);
    z-index: 6;
  }
  .vprogress-fill{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold), var(--gold-soft));
    transition: width 0.15s linear;
  }

  /* live viewers badge */
  .live{
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    display:flex;
    align-items:center;
    gap: 6px;
    background: rgba(10,9,8,0.55);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    color: var(--gold-soft);
    white-space: nowrap;
  }
  .live .dot{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #e5484d;
    box-shadow: 0 0 6px 1px rgba(229,72,77,0.8);
    animation: livepulse 1.4s ease-in-out infinite;
  }
  @keyframes livepulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.5; transform:scale(0.75); }
  }

  /* headline overlay near bottom third while playing */
  .caption{
    position: fixed;
    left: 20px;
    right: 20px;
    bottom: max(28px, calc(env(safe-area-inset-bottom) + 20px));
    z-index: 5;
    text-align:center;
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: clamp(19px, 5.5vw, 25px);
    line-height: 1.3;
    text-shadow: 0 2px 14px rgba(0,0,0,0.8);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .caption.fade{ opacity: 0; transform: translateY(6px); }

  /* floating CTA - appears when video ends, no scroll needed */
  .float-cta{
    position: fixed;
    left: 20px;
    right: 20px;
    bottom: max(24px, calc(env(safe-area-inset-bottom) + 18px));
    z-index: 7;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    background: linear-gradient(135deg, var(--gold-soft), var(--gold) 70%);
    color: #1a1408;
    font-weight: 700;
    font-size: clamp(14.5px, 4vw, 16.5px);
    padding: 16px 22px;
    border-radius: 999px;
    border: none;
    width: calc(100% - 40px);
    max-width: 380px;
    margin: 0 auto;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    box-shadow: 0 10px 30px -8px rgba(201,162,74,0.65);
    opacity: 0;
    transform: translateY(24px) scale(0.96);
    pointer-events: none;
    transition: opacity 0.5s cubic-bezier(.2,.8,.2,1), transform 0.5s cubic-bezier(.2,.8,.2,1);
  }
  .float-cta.show{
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
    animation: floatPulse 2.4s ease-in-out infinite 0.6s;
  }
  @keyframes floatPulse{
    0%,100%{ box-shadow: 0 10px 30px -8px rgba(201,162,74,0.65); }
    50%{ box-shadow: 0 10px 36px -6px rgba(201,162,74,0.9); }
  }
  .float-cta svg{ width: 19px; height: 19px; }

  /* dim overlay + glow behind CTA on end, focuses attention */
  .end-glow{
    position: fixed;
    inset: 0;
    z-index: 3;
    background: radial-gradient(ellipse at 50% 100%, rgba(201,162,74,0.28), transparent 60%);
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .end-glow.show{ opacity: 1; }
</style>

<body>

  <div class="vprogress"><div class="vprogress-fill" id="vFill"></div></div>

  <div class="live">
    <span class="dot"></span>
    <span id="liveCount">2.481</span> viendo ahora
  </div>

  <div class="stage">
    <vturb-smartplayer id="vid-6a7e28afb1d2e86c9adc0ca4" style="display: block; margin: 0 auto; width: 100%; max-width: 400px;"><div class="vturb-player-placeholder" style="position: relative; width: 100%; padding: 177.77777777777777% 0 0; z-index: 0; background-color: black;"></div></vturb-smartplayer>
    <script type="text/javascript">
      var s = document.createElement("script");
      s.src = "https://scripts.converteai.net/15c55340-cc1a-4abb-9c8a-da5918cd9642/players/6a7e28afb1d2e86c9adc0ca4/v4/player.js";
      s.async = true;
      document.head.appendChild(s);
    </script>
  </div>

  <div class="end-glow" id="endGlow"></div>

  <button class="float-cta" id="floatCta">
    Continuar
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
  </button>

  <script>
    const fill = document.getElementById('vFill');
    const floatCta = document.getElementById('floatCta');
    const endGlow = document.getElementById('endGlow');
    const liveCount = document.getElementById('liveCount');

    // El reproductor VTurb se encarga de su propio autoplay, sonido y
    // reproducción — no necesitamos nada manual aquí.

    // El botón solo debe aparecer en el minuto 2:52 del video, sincronizado.
    // Como el reproductor VTurb corre dentro de su propio player (sin exponer
    // un <video> nativo directo para nosotros), sincronizamos por tiempo
    // real desde la carga de la página — el video ya inicia
    // automáticamente en ese momento, así que ambos quedan alineados.
    const CTA_REVEAL_SECONDS = 172; // 2:52

    // Barra de progreso decorativa: se llena a lo largo de esos mismos 172s,
    // dando una pista visual de cuánto falta para que el botón se libere.
    const startTime = Date.now();
    const progressTimer = setInterval(() => {
      const elapsed = (Date.now() - startTime) / 1000;
      const pct = Math.min(100, (elapsed / CTA_REVEAL_SECONDS) * 100);
      fill.style.width = pct + '%';
      if (pct >= 100) clearInterval(progressTimer);
    }, 200);

    setTimeout(() => {
      endGlow.classList.add('show');
      floatCta.classList.add('show');
    }, CTA_REVEAL_SECONDS * 1000);

    // Contador de espectadores en vivo simulado (fluctuación sutil de prueba social)
    let base = 2481;
    setInterval(() => {
      base += Math.floor(Math.random() * 5) - 2;
      liveCount.textContent = base.toLocaleString('es-ES');
    }, 2600);

    // Clic en el CTA -> punto de entrada para avanzar a la siguiente etapa del embudo
    floatCta.addEventListener('click', () => {
      console.log('Avanzar a la siguiente etapa del embudo');
      // Si está dentro de un iframe (index.html consolidado), avisa a la página padre
      if (window.parent && window.parent !== window){
        window.parent.postMessage('funil:avancar', '*');
      }
    });
  </script>
</body>
